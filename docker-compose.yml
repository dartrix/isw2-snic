services:
  postgres:
    image: postgres:16-alpine
    container_name: snic-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: informacion_crediticia
    ports:
      - "5432:5432"
    volumes:
      - snic-postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d informacion_crediticia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: snic-api
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: informacion_crediticia
      JWT_SECRET: ${JWT_SECRET:-clave-secreta-para-desarrollo}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  snic-postgres-data:
